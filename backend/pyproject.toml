[project]
name = "sasai-wallet-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI DI callables (Depends/Query/Header/...) are evaluated once at import
# time and are safe as argument defaults; B008 is a known false positive here.
# require_admin_role is a project dependency-factory used the same way.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Security",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "app.dependencies.require_admin_role",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
# conftest configures sys.path / env before importing app modules (intentional).
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
module = "passlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "confluent_kafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
