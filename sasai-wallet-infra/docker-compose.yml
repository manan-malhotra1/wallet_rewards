# Sasai Wallet — local infrastructure
#
# Every service the platform depends on at dev-time runs here. No
# standalone Postgres / Redis / Keycloak / Kafka on the host — bring
# everything up with `docker compose up -d` from this directory.
#
# Ports exposed to the host match the backend's `.env.example` defaults
# so no env override is needed for local development.
#
# Default project name is `sasai-wallet-infra` (taken from the directory
# name). That's the prefix Compose uses when naming containers and the
# shared network, e.g. `sasai-wallet-infra-postgres-1`.

services:
  # --- PostgreSQL ----------------------------------------------------------
  # Backend's source of truth — wallets, ledger, audit, identity.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet_platform
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the wallet_platform_test database the pytest suite needs.
      - ./postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Zookeeper (Kafka coordinator) --------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # --- Kafka broker -------------------------------------------------------
  # External event ingestion topic + every other platform topic. Topics are
  # created idempotently by `kafka/topics.sh`.
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  # --- Keycloak (admin identity provider) ---------------------------------
  # Realm `wallet-platform`, clients `admin-ui` and `backend-service`.
  # Bootstrap the realm with `python scripts/bootstrap_keycloak.py` once
  # the container is healthy (~30s after `up -d`).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

  # --- Redis (sessions + rate limits) -------------------------------------
  # User session tokens (Phase F.2), OTP rate limits, lockout state.
  # `--appendonly yes` keeps the state durable across container restarts.
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # --- Celery worker (background reward reconciliation) -------------------
  # Executes the reward-outbox reconciliation task (`rewards.recon_sweep`)
  # enqueued by the beat scheduler below. Without this, the "missed reward ==
  # stuck outbox row" safety net is inert — see backend/app/celery_app.py.
  #
  # Reaches Postgres + Redis over the compose network (service names, not the
  # host `localhost` the backend uses via `make dev`), so DATABASE_URL /
  # REDIS_URL are overridden here. Keycloak/secret vars are required by
  # app.config at import time but unused by the sweep, so they carry
  # dev-only placeholders.
  rewards-worker:
    build:
      context: ../backend
    # `-E` emits task-sent/received/succeeded/failed events so Flower (below)
    # can show a live run history, not just registered task names.
    command: celery -A app.celery_app worker --loglevel=INFO -E
    # Keep the reconciliation net alive: a crash or stray signal must never
    # leave the sweep silently dead. Only an explicit `stop` keeps it down.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://wallet:wallet@postgres:5432/wallet_platform
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: wallet-platform
      KEYCLOAK_CLIENT_ID: backend-service
      KEYCLOAK_CLIENT_SECRET: unused-by-worker
      SECRET_KEY: unused-by-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/app

  # --- Celery beat (periodic scheduler) ----------------------------------
  # Fires `rewards.recon_sweep` every 60s (schedule in app/celery_app.py) onto
  # the Redis broker for the worker above to execute. Run exactly one beat —
  # a second would double-enqueue (harmless, since the sweep is idempotent,
  # but wasteful).
  rewards-beat:
    build:
      context: ../backend
    command: celery -A app.celery_app beat --loglevel=INFO
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://wallet:wallet@postgres:5432/wallet_platform
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: wallet-platform
      KEYCLOAK_CLIENT_ID: backend-service
      KEYCLOAK_CLIENT_SECRET: unused-by-worker
      SECRET_KEY: unused-by-worker
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ../backend:/app

  # --- Flower (Celery monitoring UI) -------------------------------------
  # Web dashboard at http://localhost:5555 — shows recon-sweep runs (received/
  # succeeded/failed), timings, return values, and worker liveness. Reads the
  # same Redis broker; run history depends on the worker's `-E` flag above.
  # Dev-only monitoring: no auth, so it's bound to localhost only.
  flower:
    build:
      context: ../backend
    command: celery -A app.celery_app flower --port=5555
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://wallet:wallet@postgres:5432/wallet_platform
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: wallet-platform
      KEYCLOAK_CLIENT_ID: backend-service
      KEYCLOAK_CLIENT_SECRET: unused-by-flower
      SECRET_KEY: unused-by-flower
      # Dev-only: expose the JSON API (/api/tasks, /api/workers) without a
      # login. Safe here because the port is bound to 127.0.0.1 only.
      FLOWER_UNAUTHENTICATED_API: "true"
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ../backend:/app

volumes:
  postgres-data:
  keycloak-data:
  redis-data:
